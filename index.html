<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/daylo-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/daylo-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/daylo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="DayLo" />
    <meta name="apple-mobile-web-app-title" content="DayLo" />
    <meta
      name="description"
      content="A student hub for tasks, deadlines, calendars and realistic study planning."
    />
    <meta name="theme-color" content="#F2F6F8" />
    <meta property="og:title" content="DayLo — Student Hub" />
    <meta
      property="og:description"
      content="A student hub for tasks, deadlines, calendars and realistic study planning."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/daylo-512.png" />
    <title>DayLo — Student Hub</title>
    <script>
      (() => {
        let preference = "light";

        try {
          const savedTheme = localStorage.getItem("student-hub-theme");
          preference =
            savedTheme === "dark" || savedTheme === "system"
              ? savedTheme
              : "light";
        } catch {
          preference = "light";
        }

        const resolvedTheme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;

        document.documentElement.dataset.theme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
